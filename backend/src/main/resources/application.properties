# ============================================================
# Sunrise Dental — Application Configuration
# ============================================================

# Server
# Hosting platforms (Railway, Render, ...) inject the port to bind via $PORT.
server.port=${PORT:8080}

# ============================================================
# DataSource — credentials supplied via environment variables
# Set DB_URL, DB_USERNAME, DB_PASSWORD in your environment
# or in a local .env / application-local.properties file.
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sunrise_dental}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Application metadata
# ============================================================
spring.application.name=sunrise-dental-api

# ============================================================
# CORS — origins permitted to call the API.
# Comma-separated. Set CORS_ALLOWED_ORIGINS to the deployed
# frontend URL in production.
# ============================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ============================================================
# JWT — JSON Web Token
# ============================================================
# Secret key for signing JWTs.
# Must be at least 32 characters (256 bits) for HS256.
# Override JWT_SECRET in your environment for non-development use.
jwt.secret=${JWT_SECRET}

# Token expiration in milliseconds (default: 24 hours)
jwt.expiration=${JWT_EXPIRATION:86400000}
