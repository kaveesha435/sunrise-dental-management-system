# ============================================================
# Sunrise Dental — Application Configuration
# ============================================================

# Server
server.port=8080

# ============================================================
# DataSource — credentials supplied via environment variables
# Set DB_URL, DB_USERNAME, DB_PASSWORD in your environment
# or in a local .env / application-local.properties file.
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sunrise_dental}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Application metadata
# ============================================================
spring.application.name=sunrise-dental-api

# ============================================================
# JWT — JSON Web Token
# ============================================================
# Secret key for signing JWTs.
# Must be at least 32 characters (256 bits) for HS256.
# Override JWT_SECRET in your environment for non-development use.
jwt.secret=${JWT_SECRET:SunriseDentalJwtSecretKeyForDev2024Auth}

# Token expiration in milliseconds (default: 24 hours)
jwt.expiration=${JWT_EXPIRATION:86400000}
